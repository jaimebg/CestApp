plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.jbgsoft.cestapp.qrdecoder'
version = '1.0.0'

android {
  namespace "expo.modules.qrdecoder"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.zxing:core:3.5.3'
}

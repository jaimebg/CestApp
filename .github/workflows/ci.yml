name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  validate-prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native projects
        run: npx expo prebuild --no-install

      # The version check compares against whatever Expo published last, so it
      # fails the build whenever a patch release lands, with no change here.
      # The other checks only fail when the repo changes.
      - name: Run expo-doctor
        run: npx expo-doctor@1.20.4
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: 1
